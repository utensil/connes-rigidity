name = "docbuild"
reservoir = false
version = "0.1.0"

# Keep documentation-only dependencies out of the formalization's root
# manifest, while sharing its downloaded packages and exact Mathlib revision.
packagesDir = "../.lake/packages"

# This exact revision supplies doc-gen4's interproject linking support. It lets
# the Pages build render only Connes modules while directing dependency links
# to the hosted Mathlib reference. Update it together with the Lean toolchain.
[[require]]
name = "doc-gen4"
git = "https://github.com/kim-em/doc-gen4"
rev = "49db4494978d9a81c0e344abaea146dcec78e882"

[[require]]
name = "connes-rigidity"
path = "../"

[[lean_lib]]
# Generated by mk_docs_root.py and ignored by Git.
name = "ConnesDocs"
